# Builds the page and publishes it to GitHub Pages on every push to main.
#
# The build is filled in for the deployed testnet project. The payment key is
# built in only sealed (secret VITE_PAYMENT_KEY_SEALED, made with
# web/scripts/seal-key.mjs); the link that opens the page carries the key that
# unseals it, after `#`, so it never reaches GitHub's servers.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_OUTLAYER_NETWORK: testnet
          VITE_PROJECT_ID: ${{ vars.VITE_PROJECT_ID || 'zavodil2.testnet/compliance-gateway' }}
          VITE_SECRETS_PROFILE: author
          # The officers' rows on a company's project (`owner/profile,owner/profile`):
          # a repository variable, not a secret — row names are public on chain.
          VITE_SECRETS_ROWS: ${{ vars.VITE_SECRETS_ROWS }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
          VITE_PAYMENT_KEY_SEALED: ${{ secrets.VITE_PAYMENT_KEY_SEALED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
