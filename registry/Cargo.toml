[package]
name = "policy-registry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Policy packs on NEAR: published once, deprecated by their publisher, never changed"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9.0", features = ["legacy", "unit-testing"] }
schemars = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
